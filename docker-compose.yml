services:

  db:
    image: postgres:15-alpine
    container_name: reservas-db
    restart: unless-stopped
    environment:
      POSTGRES_DB:       ${DB_NAME:-reservas}
      POSTGRES_USER:     ${DB_USER:-postgres}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-postgres}
    volumes:
      - reservas-db-data:/var/lib/postgresql/data
    networks:
      - reservas-net
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-postgres} -d ${DB_NAME:-reservas}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  api:
    build:
      context: ./app
      dockerfile: Dockerfile
    container_name: reservas-api
    restart: unless-stopped
    ports:
      - "${PORT:-3000}:3000"
    environment:
      PORT:        ${PORT:-3000}
      DB_HOST:     db
      DB_PORT:     5432
      DB_NAME:     ${DB_NAME:-reservas}
      DB_USER:     ${DB_USER:-postgres}
      DB_PASSWORD: ${DB_PASSWORD:-postgres}
    networks:
      - reservas-net
    depends_on:
      db:
        condition: service_healthy

volumes:
  reservas-db-data:
    name: reservas-db-data

networks:
  reservas-net:
    name: reservas-net
    driver: bridge
